[general]
live_config_reload =  true
ipc_socket = false
import = [
    "~/.config/alacritty/dark.theme"
]

[window]
opacity = 0.8
blur = true

[font]
size = 8
normal = { family = "CaskaydiaCove Nerd Font", style = "Regular" }

[terminal]
shell = { program = "/usr/bin/zsh" }

[mouse]
hide_when_typing = true